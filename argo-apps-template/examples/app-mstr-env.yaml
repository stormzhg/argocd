# EXAMPLE ONLY: what RUNBOOK.md §4c writes to apps/app-mstr-env-<env>.yaml (one per environment).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mstr-env-<env>
  namespace: argocd
  annotations:
    # Wave 3: after the operator (wave 2).
    argocd.argoproj.io/sync-wave: "3"
    # See RUNBOOK.md §5.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  # NO resources-finalizer: deleting this Application must never delete the environment.
spec:
  project: default
  source:
    repoURL: "<REPO_URL>"
    targetRevision: "<BRANCH>"
    path: envs/<env>
  destination:
    server: https://kubernetes.default.svc
    namespace: <env-namespace>
  syncPolicy:
    # MANUAL sync. Keep environments on manual sync: see RUNBOOK.md §8.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
