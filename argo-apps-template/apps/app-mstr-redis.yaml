# =============================================================================
# Argo CD Application — managed Redis (redis-cluster chart), ADOPTION of the
# mstrcli-installed release `mstr-redis`. See RUNBOOK.md before changing anything.
#
# Values to set per cluster: repoURL, targetRevision (both sources).
# Everything else is safety policy — do not remove it.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mstr-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"     # before the operator (wave 2)
    argocd.argoproj.io/compare-options: ServerSideDiff=true   # see app-mstr-operator.yaml
  # Deliberately NO `resources-finalizer.argocd.argoproj.io`: with it, deleting
  # this Application would delete Redis and every environment's cache.
spec:
  project: default
  sources:
    - repoURL: "git@github.com:stormzhg/argocd.git"
      targetRevision: "main"
      path: charts/redis-cluster
      helm:
        releaseName: mstr-redis           # MUST equal the live Helm release name
        valueFiles:
          - $values/values/redis-values.yaml
    - repoURL: "git@github.com:stormzhg/argocd.git"
      targetRevision: "main"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mstr-redis
  # The chart generates a RANDOM password when Helm `lookup` finds nothing, and
  # Argo CD cannot do lookups, so every render has a new password.
  ignoreDifferences:
    - group: ""                 # the live password; mstr-3rd-party-config and every
      kind: Secret              # environment's Redis secret depend on it
      name: mstr-redis-redis-cluster
      jsonPointers: [/data]
    - group: apps               # hash of that password on the pod template: without this
      kind: StatefulSet         # entry every sync restarts all Redis pods
      name: mstr-redis-redis-cluster
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    # MANUAL sync (no 'automated:' block) until a clean adoption is proven.
    # automated:
    #   prune: false     # NEVER true
    #   selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true   # without this, ignoreDifferences is ignored during sync
