# =============================================================================
# Argo CD Application — Management Service (mstr-operator chart), ADOPTION of a
# live mstrcli/Helm install. See RUNBOOK.md §5 before changing anything here.
#
# Values to set per cluster: repoURL, targetRevision (both sources).
# Everything else is safety policy — do not remove it.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mstr-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Diff by dry-running the apply on the API server: no false OutOfSync from
    # server-side defaults (CRD `priority: 0`), and removals show up in the diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  # Deliberately NO `resources-finalizer.argocd.argoproj.io`: with it, deleting
  # this Application would delete the running Management Service.
spec:
  project: default
  sources:
    - repoURL: "git@github.com:stormzhg/argocd.git"
      targetRevision: "main"
      path: charts/mstr-operator
      helm:
        releaseName: mstr-operator          # MUST equal the live Helm release name
        skipCrds: true                      # no-op for this chart (CRDs live in templates/); kept for safety
        parameters:
          # The chart refuses to render without a profile. The REAL profile stays in the
          # live Secret `mstr-customer-profile`, protected by ignoreDifferences below.
          # This placeholder is never written to the cluster. Not a secret.
          - name: mstrCustomer.profile
            value: "kept-in-cluster-see-runbook"
        valueFiles:
          - $values/values/operator-values.yaml
    - repoURL: "git@github.com:stormzhg/argocd.git"
      targetRevision: "main"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mstr-operator
  # Objects the chart fills in with Helm `lookup` (reads the live cluster). Argo CD
  # cannot do lookups, so it would render them EMPTY or RANDOM and overwrite live
  # data. Ignoring them (with RespectIgnoreDifferences=true) keeps the live values.
  # Re-check this list on every chart upgrade: RUNBOOK.md §4c.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /metadata/annotations
    - group: ""                 # ALL UBAC accounts + API keys (Secret-based clusters)
      kind: Secret
      name: mstr-cmc-accounts
      jsonPointers: [/data]
    - group: ""                 # operator customer profile (real value never in Git)
      kind: Secret
      name: mstr-customer-profile
      jsonPointers: [/data]
    - group: ""                 # cluster identity name (random if not looked up)
      kind: ConfigMap
      name: mstr-operator-config
      jsonPointers: [/data/name]
    - group: ""
      kind: Secret
      name: mstr-operator-cluster
      jsonPointers: [/data/name]
    - group: ""                 # PKCS12 password (random if not looked up)
      kind: Secret
      name: pkcs12-pass
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: mstr-api-layer-secret
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: mstr-web-layer-secret
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: mstr-validator-auth   # exists from 26.11; harmless on older charts
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: mstr-operator-tls
      jsonPointers: [/data]
    - group: ""                 # CMC assistant token (26.11+, only if assistantEnabled):
      kind: Secret              # random 64 chars if not looked up; web-layer and assistant
      name: mstr-cmc-assistant-auth   # must keep sharing the live value
      jsonPointers: [/data]
    - group: ""
      kind: PersistentVolumeClaim
      name: mstr-operator-persistent-storage
      jsonPointers:
        - /spec/resources/requests/storage
        - /spec/storageClassName
    - group: batch              # schedule is random if not looked up
      kind: CronJob
      name: mstr-telemetry-cronjob
      jsonPointers: [/spec/schedule]
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
  syncPolicy:
    # MANUAL sync: no 'automated:' block, so Argo CD only SHOWS the diff and changes
    # nothing until you press Sync. Enable auto-sync only after a clean adoption
    # (RUNBOOK.md §6 step 6) by un-commenting:
    # automated:
    #   prune: false     # NEVER true: pruning can delete the live Management Service
    #   selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true   # without this, ignoreDifferences is ignored during sync
